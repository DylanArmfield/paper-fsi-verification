% ringAddedMass, fluid side of preCICE: SU2 incompressible, INVISCID (INC_EULER), slip walls.
% The verification reference is the inviscid added-mass solution; the solids4foam tutorial's
% nu_f = 1e-7 only gives a -0.004..-0.07 % viscous frequency shift (not resolved by the meshes),
% and the FEBio evidence also uses slip walls.  Closed annulus: no inlet/outlet, the pressure
% level floats (a uniform pressure does not excite the n = 2 ovalling measure).
% Starts from the potential-flow initial condition (restart_flow_00000/00001.dat, both levels = IC).

SOLVER= INC_EULER
MATH_PROBLEM= DIRECT
RESTART_SOL= YES
RESTART_ITER= 2
READ_BINARY_RESTART= NO

INC_NONDIM= DIMENSIONAL
INC_DENSITY_MODEL= CONSTANT
FLUID_MODEL= CONSTANT_DENSITY
INC_DENSITY_INIT= 140.0
% reference values only (force coefficients in the history; preCICE forces are dimensional)
INC_VELOCITY_INIT= ( 1.5E-3, 0.0, 0.0 )
REF_AREA= 1.0
REF_LENGTH= 1.0
INC_ENERGY_EQUATION= NO
BETA_FACTOR= 1000000.0

TIME_DOMAIN= YES
TIME_MARCHING= DUAL_TIME_STEPPING-2ND_ORDER
TIME_STEP= 0.03481928202730504
MAX_TIME= 1.0E6
TIME_ITER= 99999999
INNER_ITER= 1000

MARKER_EULER= ( interface, wall )
MARKER_MONITORING= ( interface )
MARKER_PLOTTING= ( interface )

% ring outer surface moves (marker "interface": hard-coded in the SU2 preCICE adapter); outer wall fixed
DEFORM_MESH= YES
MARKER_DEFORM_MESH= ( interface )
% CG + ILU returns NaN when the first window's displacement is exactly zero (the ring starts
% undeformed; checks/su2ic); FGMRES + ILU does not
DEFORM_LINEAR_SOLVER= FGMRES
DEFORM_LINEAR_SOLVER_PREC= ILU
DEFORM_LINEAR_SOLVER_ERROR= 1E-12
DEFORM_LINEAR_SOLVER_ITER= 1000
DEFORM_NONLINEAR_ITER= 1
% WALL_DISTANCE (FSI1, cavity) is the distance to viscous walls, and an inviscid case has none
DEFORM_STIFFNESS_TYPE= INVERSE_VOLUME

NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT
CFL_NUMBER= 1000.0
CFL_ADAPT= NO
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-8
LINEAR_SOLVER_ITER= 50
MGLEVEL= 0

CONV_FIELD= ( RMS_PRESSURE, RMS_VELOCITY-X, RMS_VELOCITY-Y )
CONV_RESIDUAL_MINVAL= -14.0
CONV_STARTITER= 0

SCREEN_OUTPUT= ( TIME_ITER, CUR_TIME, INNER_ITER, RMS_PRESSURE, RMS_VELOCITY-X, RMS_VELOCITY-Y, DRAG, LIFT )
SCREEN_WRT_FREQ_INNER= 1000
HISTORY_OUTPUT= ( TIME_ITER, CUR_TIME, INNER_ITER, RMS_RES, AERO_COEFF )
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE )
MESH_FILENAME= fluid.su2
MESH_FORMAT= SU2
OUTPUT_FILES= ( RESTART, PARAVIEW )
OUTPUT_WRT_FREQ= ( 25, 25 )
CONV_FILENAME= history
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
SOLUTION_FILENAME= restart_flow.dat
RESTART_FILENAME= restart_flow.dat
BREAKDOWN_FILENAME= forces_breakdown.dat
