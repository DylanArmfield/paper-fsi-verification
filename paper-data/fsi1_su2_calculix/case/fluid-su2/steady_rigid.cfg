% Hron-Turek FSI1, stage 1: steady incompressible flow past the RIGID cylinder + plate
% (= Turek-Hron CFD1). Replaces the 0-2 s rigid-plate inlet ramp of the solids4foam / PR #75
% protocol; its solution is the initial state of the coupled run (stage 2).
% rho = 1000 kg/m^3, nu = 1e-3 m^2/s (mu = 1.0 Pa s), parabolic inlet Umax = 0.3 m/s (mean 0.2).

SOLVER= INC_NAVIER_STOKES
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
TIME_DOMAIN= NO
ITER= @STEADY_ITER@

INC_NONDIM= DIMENSIONAL
INC_DENSITY_MODEL= CONSTANT
FLUID_MODEL= CONSTANT_DENSITY
INC_DENSITY_INIT= 1000.0
% Initial field AND force reference: 0.5*rho*|V_init|^2*REF_AREA = 0.5*1000*0.04*0.05 = 1,
% so CD/CL and FORCE_X/Y in the history are drag/lift in N/m.
INC_VELOCITY_INIT= ( 0.2, 0.0, 0.0 )
REF_AREA= 0.05
REF_LENGTH= 1.0
INC_ENERGY_EQUATION= NO
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.0

MARKER_HEATFLUX= ( cylinder, 0.0, interface, 0.0, top, 0.0, bottom, 0.0 )
INC_INLET_TYPE= VELOCITY_INLET
MARKER_INLET= ( inlet, 288.15, 0.2, 1.0, 0.0, 0.0 )
SPECIFIED_INLET_PROFILE= YES
INLET_FILENAME= inlet_profile.dat
INC_OUTLET_TYPE= PRESSURE_OUTLET
MARKER_OUTLET= ( outlet, 0.0 )
MARKER_MONITORING= ( cylinder, interface )
MARKER_PLOTTING= ( cylinder, interface )

% Second-order upwind (OpenFOAM linearUpwind analogue), no limiter (smooth flow, Re = 20)
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT
CFL_NUMBER= 50.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.5, 50.0, 1.0E5 )
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-8
LINEAR_SOLVER_ITER= 50
MGLEVEL= 0

CONV_FIELD= ( RMS_PRESSURE, RMS_VELOCITY-X, RMS_VELOCITY-Y )
CONV_RESIDUAL_MINVAL= -12
CONV_STARTITER= 10

SCREEN_OUTPUT= ( INNER_ITER, RMS_PRESSURE, RMS_VELOCITY-X, RMS_VELOCITY-Y, DRAG, LIFT, AVG_CFL )
SCREEN_WRT_FREQ_INNER= 100
HISTORY_OUTPUT= ( ITER, RMS_RES, AERO_COEFF, CFL_NUMBER )
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE )
MESH_FILENAME= @MESH@
MESH_FORMAT= SU2
OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_CSV )
OUTPUT_WRT_FREQ= ( 1000000, 1000000, 1000000 )
CONV_FILENAME= history_steady
VOLUME_FILENAME= flow_steady
SURFACE_FILENAME= surface_steady
RESTART_FILENAME= restart_steady.dat
BREAKDOWN_FILENAME= forces_breakdown_steady.dat
