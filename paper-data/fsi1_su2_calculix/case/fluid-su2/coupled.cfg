% Hron-Turek FSI1, stage 2: coupled unsteady incompressible flow (SU2 side of preCICE).
% Starts from the stage-1 steady rigid-plate solution (restart_flow_00000/00001.dat), as the
% solids4foam / PR #75 coupled stage starts from the end of the 0-2 s rigid-plate ramp.
% Same physics and spatial discretisation as steady_rigid.cfg.

SOLVER= INC_NAVIER_STOKES
MATH_PROBLEM= DIRECT
RESTART_SOL= YES
RESTART_ITER= 2

INC_NONDIM= DIMENSIONAL
INC_DENSITY_MODEL= CONSTANT
FLUID_MODEL= CONSTANT_DENSITY
INC_DENSITY_INIT= 1000.0
% Force reference 0.5*1000*0.2^2*0.05 = 1: CD/CL in the history are drag/lift in N/m.
INC_VELOCITY_INIT= ( 0.2, 0.0, 0.0 )
REF_AREA= 0.05
REF_LENGTH= 1.0
INC_ENERGY_EQUATION= NO
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.0

% Second-order backward time stepping (OpenFOAM 'backward' analogue); dt = coupling window
TIME_DOMAIN= YES
TIME_MARCHING= DUAL_TIME_STEPPING-2ND_ORDER
TIME_STEP= @DT@
MAX_TIME= 1.0E6
TIME_ITER= 99999999
INNER_ITER= @INNER_ITER@

MARKER_HEATFLUX= ( cylinder, 0.0, interface, 0.0, top, 0.0, bottom, 0.0 )
INC_INLET_TYPE= VELOCITY_INLET
MARKER_INLET= ( inlet, 288.15, 0.2, 1.0, 0.0, 0.0 )
SPECIFIED_INLET_PROFILE= YES
INLET_FILENAME= inlet_profile.dat
INC_OUTLET_TYPE= PRESSURE_OUTLET
MARKER_OUTLET= ( outlet, 0.0 )
MARKER_MONITORING= ( cylinder, interface )
MARKER_PLOTTING= ( cylinder, interface )

% Only the plate moves (marker "interface": the SU2 preCICE adapter hard-codes that name);
% the mesh follows by linear-elastic deformation, cylinder/walls fixed
DEFORM_MESH= YES
MARKER_DEFORM_MESH= ( interface )
DEFORM_LINEAR_SOLVER= CONJUGATE_GRADIENT
DEFORM_LINEAR_SOLVER_PREC= ILU
DEFORM_LINEAR_SOLVER_ERROR= 1E-12
DEFORM_LINEAR_SOLVER_ITER= 1000
DEFORM_NONLINEAR_ITER= 1
DEFORM_STIFFNESS_TYPE= WALL_DISTANCE

NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT
CFL_NUMBER= 1000.0
CFL_ADAPT= NO
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-8
LINEAR_SOLVER_ITER= 50
MGLEVEL= 0

% Inner (pseudo-time) convergence per solve; absolute, set from the stage-1 residual levels
CONV_FIELD= ( RMS_PRESSURE, RMS_VELOCITY-X, RMS_VELOCITY-Y )
CONV_RESIDUAL_MINVAL= @INNER_MINVAL@
CONV_STARTITER= 0

SCREEN_OUTPUT= ( TIME_ITER, CUR_TIME, INNER_ITER, RMS_PRESSURE, RMS_VELOCITY-X, RMS_VELOCITY-Y, DRAG, LIFT )
SCREEN_WRT_FREQ_INNER= 1000
HISTORY_OUTPUT= ( TIME_ITER, CUR_TIME, INNER_ITER, RMS_RES, AERO_COEFF, AERO_COEFF_SURF )
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE )
MESH_FILENAME= @MESH@
MESH_FORMAT= SU2
OUTPUT_FILES= ( RESTART, PARAVIEW )
OUTPUT_WRT_FREQ= ( 400, 400 )
CONV_FILENAME= history
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
SOLUTION_FILENAME= restart_flow.dat
RESTART_FILENAME= restart_flow.dat
BREAKDOWN_FILENAME= forces_breakdown.dat
