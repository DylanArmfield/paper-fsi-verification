% Hron-Turek CFD3 (rigid flag, unsteady): SU2 7.5.1 incompressible, BDF2 dual time stepping.
% Physics as the FSI3 fluid: rho 1000, mu 1 (nu 1e-3), parabolic inlet Umax 3 (mean 2) at nodes.
% Force reference: 0.5 * rho * |INC_VELOCITY_INIT|^2 * REF_AREA = 0.5*1000*4*5e-4 = 1, so CD/CL
% are drag/lift in N/m (same convention as the coupled FSI1 cfg in ../case).
% Placeholders filled by scripts/setup_cfd3.py.
SOLVER= INC_NAVIER_STOKES
MATH_PROBLEM= DIRECT
RESTART_SOL= @RESTART@
RESTART_ITER= @RESTART_ITER@
TIME_DOMAIN= YES
TIME_MARCHING= DUAL_TIME_STEPPING-2ND_ORDER
TIME_STEP= @DT@
MAX_TIME= 1.0E6
TIME_ITER= @TIME_ITER@
INNER_ITER= @INNER_ITER@
%
INC_NONDIM= DIMENSIONAL
INC_DENSITY_MODEL= CONSTANT
FLUID_MODEL= CONSTANT_DENSITY
INC_DENSITY_INIT= 1000.0
INC_VELOCITY_INIT= ( 2.0, 0.0, 0.0 )
BETA_FACTOR= @BETA@
REF_AREA= 5.0E-4
REF_LENGTH= 1.0
INC_ENERGY_EQUATION= NO
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.0
%
MARKER_HEATFLUX= ( cylinder, 0.0, plate, 0.0, top, 0.0, bottom, 0.0 )
INC_INLET_TYPE= VELOCITY_INLET
MARKER_INLET= ( inlet, 288.15, 2.0, 1.0, 0.0, 0.0 )
SPECIFIED_INLET_PROFILE= YES
INLET_FILENAME= inlet_profile.dat
INC_OUTLET_TYPE= PRESSURE_OUTLET
MARKER_OUTLET= ( outlet, 0.0 )
MARKER_MONITORING= ( cylinder, plate )
MARKER_PLOTTING= ( cylinder, plate )
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT
CFL_NUMBER= 1000.0
CFL_ADAPT= NO
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-8
LINEAR_SOLVER_ITER= 50
MGLEVEL= 0
%
CONV_FIELD= ( RMS_PRESSURE, RMS_VELOCITY-X, RMS_VELOCITY-Y )
CONV_RESIDUAL_MINVAL= @INNER_MINVAL@
CONV_STARTITER= 0
%
SCREEN_OUTPUT= ( TIME_ITER, CUR_TIME, INNER_ITER, RMS_PRESSURE, RMS_VELOCITY-X, RMS_VELOCITY-Y, DRAG, LIFT )
SCREEN_WRT_FREQ_INNER= 1000
SCREEN_WRT_FREQ_TIME= 100
HISTORY_OUTPUT= ( TIME_ITER, CUR_TIME, INNER_ITER, RMS_RES, AERO_COEFF, AERO_COEFF_SURF )
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE )
MESH_FILENAME= fluid.su2
MESH_FORMAT= SU2
OUTPUT_FILES= ( RESTART )
OUTPUT_WRT_FREQ= ( @WRT@ )
CONV_FILENAME= history
RESTART_FILENAME= restart_flow.dat
SOLUTION_FILENAME= restart_flow.dat
